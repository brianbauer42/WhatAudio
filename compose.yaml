# The full stack: `docker compose up -d --build` serves the app on
# http://localhost:8080. For `pnpm run dev`, start only the backing services
# with `docker compose up -d postgres garage`.
#
# Credentials here are development-only and match the defaults in .env.example.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: whataudio
      POSTGRES_PASSWORD: whataudio
      POSTGRES_DB: whataudio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whataudio -d whataudio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage for uploaded audio and art.
  # --single-node skips the cluster layout step; --default-bucket creates the
  # access key and bucket named below on first start.
  garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: whataudio
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

  app:
    build: .
    environment:
      # Production build, but with the throwaway credentials above, plain HTTP
      # cookies and open registration so it works out of the box on localhost.
      SESSION_SECRET: ${SESSION_SECRET:-insecure-compose-secret}
      DATABASE_URL: postgres://whataudio:whataudio@postgres:5432/whataudio
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: whataudio
      S3_ACCESS_KEY: GK0123456789abcdef01234567
      S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
      ALLOW_REGISTRATIONS: "true"
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    # Garage may still be creating its default bucket on the first boot; the
    # server exits if it can't reach it, and this brings it back.
    restart: unless-stopped

volumes:
  postgres-data:
  garage-meta:
  garage-data:
